name: Release

# A tag v* builds the binaries, writes SHA256SUMS and creates a DRAFT release. Nothing is published here: a person opens the
# draft, reads it and publishes it.
# "Run workflow" does the same without a tag. The archives and SHA256SUMS stay workflow artifacts; tick draft to also create
# a draft release named after the tag field (that name is not an existing tag).
# No cache: a release is built from nothing, with `cargo build --locked`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Name for the archives and the draft (a tag push uses the tag itself)
        default: v0.0.0-test
      draft:
        description: Also create a draft release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 on purpose: the binary then needs glibc 2.35, not the 2.39 of the newer image. GitHub retires this image
          # on 2027-04-17; then switch to ubuntu-24.04 (and say in the release notes that glibc 2.39 is now needed).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Version name
        run: printf '%s\n' "$VERSION" | grep -Eq '^v[0-9][A-Za-z0-9._-]*$' || { echo "not a version name like v1.2.3"; exit 1; }

      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }} for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
          rustc -Vv
          cargo -V

      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      # Builds with the cargo, rustup and workspace paths remapped, starts the binary, packs it, unpacks the archive and fails
      # if it holds a home directory or a path of this machine (M9).
      - name: Build, check and pack
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/release.sh "$TARGET" "$VERSION"

      - name: Keep the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcrowd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  sums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write and check SHA256SUMS
        working-directory: dist
        run: |
          set -- zcrowd-*
          [ "$#" -eq 3 ] || { echo "expected 3 archives, found $#: $*"; exit 1; }
          sha256sum "$@" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Keep SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # The only job that can write to the repository, and it only creates a draft.
  draft:
    name: draft release
    needs: sums
    if: github.ref_type == 'tag' || inputs.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the archives and SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FROM_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          {
            echo "Built from commit $GITHUB_SHA by $RUN_URL with Rust $RUST_VERSION and cargo build --locked."
            echo
            echo "Check a download against SHA256SUMS: sha256sum -c SHA256SUMS (Linux), shasum -a 256 -c SHA256SUMS (macOS), Get-FileHash (Windows)."
          } > ../notes.md
          if [ "$FROM_TAG" = true ]; then pin=(--verify-tag); else pin=(--target "$GITHUB_SHA"); fi
          gh release create "$VERSION" --repo "$REPO" --draft --title "$VERSION" --notes-file ../notes.md "${pin[@]}" zcrowd-* SHA256SUMS
