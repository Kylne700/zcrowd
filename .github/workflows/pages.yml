name: Pages

# A push to master, or "Run workflow", publishes web/index.html to GitHub Pages. That one file and nothing else from the repository.
# build   copies web/index.html into an empty directory and uploads that directory as the Pages artifact.
# deploy  publishes the artifact. Only this job may write Pages and ask for the OIDC token that shows where the deployment came from.
# Nothing is built here: the page is one file with its data inside, and tests/audit.sh (P10) checks that the committed file is what
# `node web/build.mjs` makes.
# Once, by a person: Settings > Pages > Build and deployment > Source = "GitHub Actions". Until then the deploy job fails.
# ubuntu-24.04, not ubuntu-latest, for the reason given in ci.yml.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A run in progress is never cancelled: a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: stage the page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mkdir without -p: it must not exist yet, so the directory holds the page and nothing else.
      - name: Copy the page into an empty directory
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp web/index.html "$RUNNER_TEMP/site/index.html"

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: publish to Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
