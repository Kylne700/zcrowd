[package]
name = "zcrowd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Check how big a crowd your Zcash unshield (or shield) amount hides in"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rpassword = "7"
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }
zcrowd-core = { path = "../zcrowd-core" }

[dev-dependencies]
zcash_address = "0.14"
zcash_protocol = "0.11.0"
